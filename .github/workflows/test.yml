name: Lint, Format & Test

on: push

jobs:
  lint-format-test:
    name: Lint, format & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build SDK
        run: pnpm --filter @skalenetwork/privacy-sdk run build

      - name: Build MCP
        run: pnpm --filter @skalenetwork/privacy-mcp run build

      - name: Test SDK
        run: pnpm --filter @skalenetwork/privacy-sdk run test
