name: Publish to npm

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - beta
      - main

jobs:
  publish:
    name: Build and publish
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @skalenetwork/privacy-sdk run build

      - name: Build MCP
        run: pnpm --filter @skalenetwork/privacy-mcp run build

      - name: Set version and branch
        run: |
          export BRANCH=$GITHUB_BASE_REF
          export VERSION=$(node -p "require('./package.json').version")
          echo "Branch: $BRANCH"
          echo "Base version: $VERSION"
          export VERSION=$(bash ./scripts/calculate_version.sh)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "Version $VERSION"

      - name: Publish SDK (pre-release)
        if: env.BRANCH != 'main'
        working-directory: packages/sdk
        run: |
          npm version --no-git-tag-version ${{ env.VERSION }}
          pnpm publish --access public --tag ${{ env.BRANCH }} --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish MCP (pre-release)
        if: env.BRANCH != 'main'
        working-directory: packages/mcp
        run: |
          npm version --no-git-tag-version ${{ env.VERSION }}
          pnpm publish --access public --tag latest --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish SDK (stable)
        if: env.BRANCH == 'main'
        working-directory: packages/sdk
        run: |
          npm version --no-git-tag-version ${{ env.VERSION }}
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish MCP (stable)
        if: env.BRANCH == 'main'
        working-directory: packages/mcp
        run: |
          npm version --no-git-tag-version ${{ env.VERSION }}
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set release
        run: |
          if [[ "$BRANCH" == "main" ]]; then
            export PRERELEASE=false
          else
            export PRERELEASE=true
          fi
          echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          draft: false
          prerelease: ${{ env.PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
